name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (inclui eslint-plugin-boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Integration tests (banco descartável do service container — migrations aplicadas pelo globalSetup do Vitest)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  smoke:
    # "Sobe o app e bate em algumas rotas" — pega o que passa no build e quebra em runtime
    # (ex: ERR_REQUIRE_ESM do jsdom). Roda no Node 22, igual à produção.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: smoke-test-secret-not-real
      NEXTAUTH_SECRET: smoke-test-secret-not-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate (core)
        # A primeira migration de plugin roda no install (platform/plugin-engine/run-plugin-
        # migrations.ts); as seguintes, de plugin já instalado, no prebuild do Build abaixo
        # (db:migrate:plugins — no-op aqui, sem plugin instalado). O smoke só bate em rotas de core
        # (/, /login, /setup, /cursos, /academy, /api/auth/providers), então o schema de core basta.
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Start + smoke
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/setup && break
            sleep 1
          done
          npm run smoke
          kill $APP_PID || true
