name: CI

on:
  # Todo branch — inclusive os de instância (broadcast-fem, portal-colaborador...), que só diferem de
  # main nos pacotes @venore/plugin-*/theme-*: um bump de plugin passa a rodar lint/typecheck/testes
  # e os testes do próprio plugin (job `plugins`) antes do deploy. Branches claude/** rodam via PR.
  push:
    branches: ["**", "!claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (inclui eslint-plugin-boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  plugins:
    # Testes unitários dos plugins instalados neste branch (vitest.plugins.config.ts procura em
    # ../venore-plugin-<nome>). Os pacotes vêm do npm ci em node_modules/@venore/plugin-*; o link
    # simbólico coloca cada um onde a config espera. Em main (sem plugin) não roda nada.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link dos plugins instalados
        run: |
          for dir in node_modules/@venore/plugin-*; do
            [ -d "$dir" ] || continue
            name="${dir#node_modules/@venore/plugin-}"
            ln -sfn "$PWD/$dir" "../venore-plugin-$name"
            echo "plugin: $name"
          done

      - name: Testes dos plugins
        run: npm run test:plugins

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Integration tests (banco descartável do service container — migrations aplicadas pelo globalSetup do Vitest)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  smoke:
    # "Sobe o app e bate em algumas rotas" — pega o que passa no build e quebra em runtime
    # (ex: ERR_REQUIRE_ESM do jsdom). Roda no Node 22, igual à produção.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: smoke-test-secret-not-real
      NEXTAUTH_SECRET: smoke-test-secret-not-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate (core)
        # A primeira migration de plugin roda no install (platform/plugin-engine/run-plugin-
        # migrations.ts); as seguintes, de plugin já instalado, no prebuild do Build abaixo
        # (db:migrate:plugins — no-op aqui, sem plugin instalado). O smoke só bate em rotas de core
        # (/, /login, /setup, /cursos, /academy, /api/auth/providers), então o schema de core basta.
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Start + smoke
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/setup && break
            sleep 1
          done
          npm run smoke
          kill $APP_PID || true

  e2e:
    # Primeiro acesso de ponta a ponta (setup com SETUP_TOKEN + login) num banco vazio.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: e2e-test-secret-not-real
      SETUP_TOKEN: e2e-setup-token-not-real-0123456789
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (aplica as migrations no prebuild)
        run: npm run build

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  themes:
    # Gate de temas da v8 (spec §10) — sem banco e sem `next build`. Esqueleto da Fase F: roda a
    # suíte vitest.themes.config.ts (SSR dos temas do registro). Dono do corpo: W10 (CSS
    # compilado, Playwright em 390/1280 claro/escuro, axe contra baseline, screenshots e relatório
    # como artefatos).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Codegen estrito dos temas
        run: npx tsx scripts/gen-theme-registry.ts --strict

      - name: Suíte de temas
        run: npx vitest run --config vitest.themes.config.ts

      - name: Relatório do codegen de temas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-report
          path: src/themes/theme-report.generated.json
          retention-days: 14
